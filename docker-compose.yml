version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: sentinelops-mysql
    restart: always
    environment:
      MYSQL_DATABASE: sentinelops_db
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_USER: sentinelops_user
      MYSQL_PASSWORD: user_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
    driver: local
